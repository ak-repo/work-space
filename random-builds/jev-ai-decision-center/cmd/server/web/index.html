<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev Decision Center</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div><h1>Jev AI Decision Control Center</h1><p>System-One decisions → deterministic Go policy → audited action</p></div><span id="status">connecting…</span></header>
<main><section class="grid kpis"><article><small>Decisions</small><strong id="kDecisions">0</strong></article><article><small>Avg Jev latency</small><strong id="kLatency">–</strong></article><article><small>Auto-routed</small><strong id="kRoute">0</strong></article><article><small>Human review</small><strong id="kReview">0</strong></article></section>
<section class="panel composer"><h2>Send demo event</h2><div class="form"><input id="title" value="Payment API outage"><textarea id="state">{"message":"Payment API is unavailable for many users", "service":"payments", "error_rate":0.42}</textarea><button id="send">Process with Jev</button></div><pre id="last"></pre></section>
<section class="panel"><div class="section-title"><h2>Live decisions</h2><button id="refresh">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Event</th><th>Category</th><th>Confidence</th><th>Action</th><th>Latency</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/app.js"></script></body></html>
